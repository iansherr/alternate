name: KMP Room iOS persistence spike

on:
  pull_request:
    branches: [spike/kmp-shared-core]
    paths:
      - "shared-core/**"
      - "gradle/libs.versions.toml"
      - "build.gradle.kts"
      - ".github/workflows/kmp-room-spike.yml"

permissions:
  contents: read

concurrency:
  group: kmp-room-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-regression:
    name: Android app unchanged + KMP Room compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install API 37.0
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | head -n 1)"
          "$SDK_MANAGER" --install --channel=3 "platforms;android-37.0"
      - name: Compile Android and shared Room module, run host tests
        run: |
          git rev-parse HEAD
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :shared-core:assemble :shared-core:testAndroidHostTest --stacktrace --no-daemon

  ios-room-persistence:
    name: iOS simulator KMP Room roundtrip
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Xcode 26.4.1 and Android SDK
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | head -n 1)"
          "$SDK_MANAGER" --install --channel=3 "platforms;android-37.0"
      - name: Compile + run iOS Room persistence unit test
        run: |
          git rev-parse HEAD
          ./gradlew :shared-core:iosSimulatorArm64Test --stacktrace --no-daemon
