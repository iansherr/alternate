name: iOS Call Directory packaging probe

on:
  pull_request:
    branches: [main, spike/ios-call-directory-probe, spike/ios-consented-index]
    paths:
      - "ios-probe/**"
      - ".github/workflows/ios-call-directory-probe.yml"

permissions:
  contents: read

concurrency:
  group: call-directory-probe-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-probe:
    name: Build unsigned Swift host and Call Directory extension
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Use Xcode 26.4.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
      - name: Execute caller index contract tests
        working-directory: ios-probe
        run: swift test --parallel
      - name: Build both iOS targets without signing
        working-directory: ios-probe
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project CallerIdProbe.xcodeproj \
            -scheme ProbeApp -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO build
      - name: Verify extension packaged with host
        working-directory: ios-probe
        run: |
          set -euo pipefail
          APP=".build/Build/Products/Debug-iphonesimulator/ProbeApp.app"
          EXT="$APP/PlugIns/CallerIdExtension.appex"
          test -d "$APP"
          test -d "$EXT"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$EXT/Info.plist" | grep -qx 'com.apple.callkit.call-directory'
          echo "Call Directory extension embedded and identified in built host."

      - name: Install, launch and UI-test on iOS simulator
        working-directory: ios-probe
        timeout-minutes: 25
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEVICE="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          for runtime, devices in data.items():
              if "iOS" in runtime:
                  for device in devices:
                      if device.get("isAvailable") and "iPhone" in device["name"]:
                          print(device["udid"]);sys.exit(0)
          sys.exit(2)
          ')"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=".build/Build/Products/Debug-iphonesimulator/ProbeApp.app"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" dev.alternate.calleridprobe
          xcodebuild test -project CallerIdProbe.xcodeproj -scheme ProbeApp \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -only-testing:ProbeUITests \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO
