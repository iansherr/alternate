name: Android instrumented migration baseline

# Fork-local, no release signing and no write-capable GitHub token.
on:
  pull_request:
    branches: [ci/android-pr-baseline]
    paths:
      - ".github/workflows/android-emulator-migrations.yml"
      - "app/src/androidTest/**"
      - "app/src/main/**"
      - "app/schemas/**"
      - "app/build.gradle.kts"
      - "gradle/**"

permissions:
  contents: read

concurrency:
  group: android-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-regression:
    name: Run existing Room v4 to v5 migration on emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install compile SDK API 37.0
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | head -n 1)"
          "$SDK_MANAGER" --install --channel=3 "platforms;android-37.0"
          git rev-parse HEAD

      - name: Enable Linux KVM device permissions for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pinned immutable commit from reactivecircus/android-emulator-runner v2.35.0.
      # No secrets, no external uploads or GitHub write permissions.
      - name: Verify real Android SQLite migration in emulator
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon
