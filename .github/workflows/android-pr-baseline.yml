name: Android PR Baseline

# Run baseline checks on ordinary PRs, without release signing or publishing.
# Deliberately separate from android-release.yml and require no secrets.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-pr-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-baseline:
    name: Android unit tests + debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7

      - name: Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android 17 preview SDK (API 37.0) is installed
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | head -n 1)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "::error::Android SDK command-line tools missing from $ANDROID_HOME"
            exit 1
          fi
          "$SDK_MANAGER" --install --channel=3 "platforms;android-37.0"
          ls -lah "$ANDROID_HOME/platforms"

      - name: Record toolchain
        run: |
          java -version
          ./gradlew --version
          git rev-parse HEAD

      - name: Verify tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
