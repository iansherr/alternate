name: KMP shared core experiment

on:
  push:
    branches: [spike/kmp-shared-core]
  pull_request:
    branches: [main]
    paths:
      - "shared-core/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/kmp-core-spike.yml"

permissions:
  contents: read

concurrency:
  group: kmp-core-spike-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unchanged baseline + KMP library
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android 17 preview platform 37.0
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | head -n 1)"
          "$SDK_MANAGER" --install --channel=3 "platforms;android-37.0"
      - name: Verify exact head and Gradle builds
        run: |
          git rev-parse HEAD
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :shared-core:assemble --stacktrace --no-daemon

  ios:
    name: Compile common Kotlin for iOS simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Select Xcode 26.4.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
      - name: Install Android 17 preview platform for Gradle configuration
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | head -n 1)"
          "$SDK_MANAGER" --install --channel=3 "platforms;android-37.0"
      - name: Compile iOS simulator target
        run: |
          git rev-parse HEAD
          ./gradlew :shared-core:compileKotlinIosSimulatorArm64 --stacktrace --no-daemon
